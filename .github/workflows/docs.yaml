name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.13.1"
          allow-prereleases: true

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ttihp26b
